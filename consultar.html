<body class="min-h-screen">
<header class="sticky top-0 z-40 w-full bg-white/80 dark:bg-black/80 ios-blur border-b border-gray-200/50 dark:border-white/10 safe-top">
<div class="flex items-center justify-between px-4 h-16">
<a href="dashboard.html" class="flex items-center gap-2">
<span class="material-symbols-outlined text-gray-600 dark:text-gray-300">arrow_back_ios</span>
</a>
<h1 class="text-lg font-bold text-gray-900 dark:text-white flex-1 text-center">Consultar Clientes</h1>
<div class="size-8"></div>
</div>
</header>

<main class="px-4 pb-32">
<!-- Busca -->
<div class="bg-white dark:bg-card-dark rounded-ios-xl p-4 shadow-sm border border-gray-100 dark:border-white/5 mb-4">
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">search</span>
<input id="search-input" class="w-full pl-12 pr-4 py-3 rounded-ios-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm text-[#000000] dark:text-white" placeholder="Buscar por nome ou CPF" autocomplete="off">
</div>
</div>

<!-- Filtros -->
<div class="flex gap-2 mb-4 overflow-x-auto no-scrollbar">
<button class="filter-btn active px-4 py-2 rounded-full text-sm font-medium bg-primary text-white" data-filter="all">Todos</button>
<button class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400" data-filter="active">Ativos</button>
<button class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400" data-filter="inactive">Inativos</button>
</div>

<!-- Resultados -->
<div class="mb-4">
<p id="result-count" class="text-sm text-gray-500 dark:text-gray-400">Carregando clientes...</p>
</div>

<!-- Lista de clientes -->
<div id="clients-container" class="space-y-3">
<div class="text-center py-10">
<div class="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto"></div>
<p class="text-gray-500 mt-4">Carregando clientes...</p>
</div>
</div>
</main>

<!-- Botão Flutuante -->
<a href="novo-cadastro.html" class="fixed bottom-20 right-6 flex size-16 items-center justify-center rounded-full bg-primary text-white shadow-2xl active:scale-95 transition-transform z-40">
<span class="material-symbols-outlined text-[32px]">person_add</span>
</a>

<nav class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-black/80 ios-blur border-t border-gray-200 dark:border-white/10 safe-bottom z-50">
<div class="flex justify-around items-center h-16">
<a class="flex flex-col items-center gap-0.5 text-gray-400 dark:text-gray-500" href="dashboard.html">
<span class="material-symbols-outlined text-[26px]">home</span>
<span class="text-[10px] font-medium">Início</span>
</a>
<a class="flex flex-col items-center gap-0.5 text-gray-400 dark:text-gray-500" href="mapa.html">
<span class="material-symbols-outlined text-[26px]">map</span>
<span class="text-[10px] font-medium">Rotas</span>
</a>
<a class="flex flex-col items-center gap-0.5 text-gray-400 dark:text-gray-500" href="ponto.html">
<span class="material-symbols-outlined text-[26px]">punch_clock</span>
<span class="text-[10px] font-medium">Ponto</span>
</a>
<a class="flex flex-col items-center gap-0.5 text-primary" href="consultar.html">
<span class="material-symbols-outlined text-[26px]" style="font-variation-settings: 'FILL' 1">groups</span>
<span class="text-[10px] font-semibold">Clientes</span>
</a>
<a class="flex flex-col items-center gap-0.5 text-gray-400 dark:text-gray-500" href="ajustes.html">
<span class="material-symbols-outlined text-[26px]">settings</span>
<span class="text-[10px] font-medium">Ajustes</span>
</a>
</div>
</nav>

<!-- Scripts do App -->
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/feedback.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('search-input');
    const container = document.getElementById('clients-container');
    const resultCount = document.getElementById('result-count');
    let searchTimeout;
    let currentFilter = 'all';
    
    // Filtros
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            // Remove classe ativa de todos
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('active', 'bg-primary', 'text-white');
                b.classList.add('bg-gray-100', 'text-gray-600');
            });

            // Adiciona classe ativa ao clicado
            btn.classList.add('active', 'bg-primary', 'text-white');
            btn.classList.remove('bg-gray-100', 'text-gray-600');

            currentFilter = btn.dataset.filter;
            loadClients(searchInput.value.trim());
        });
    });
    
    // Carrega clientes iniciais
    loadClients('');
    
    // Busca
    if (searchInput) {
        searchInput.addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(function() {
                loadClients(e.target.value.trim());
            }, 400);
        });
    }
    
    async function loadClients(query) {
        container.innerHTML = '<div class="text-center py-10">' +
            '<div class="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto"></div>' +
            '<p class="text-gray-500 mt-4">Buscando...</p>' +
        '</div>';
        
        try {
            // Obtém o token do localStorage
            const token = localStorage.getItem('auth_token');
            
            let url = '/api/search-clients.php?limit=50';
            if (query) {
                url += '&search=' + encodeURIComponent(query);
            }
            if (currentFilter !== 'all') {
                url += '&status=' + currentFilter;
            }
            
            const headers = {
                'Content-Type': 'application/json'
            };
            
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }
            
            const response = await fetch(url, { headers });
            const result = await response.json();
            
            console.log('Clientes:', result);
            
            if (result.success && result.data && result.data.length > 0) {
                resultCount.textContent = result.data.length + ' cliente(s) encontrado(s)';
                
                container.innerHTML = result.data.map(function(client) {
                    const cpfFormatado = Utils.formatCPF(client.cpf);
                    const isActive = client.active == 1 || client.status === 'ativo';
                    const statusClass = isActive 
                        ? 'bg-green-100 text-green-600 dark:bg-green-900/30 dark:text-green-400' 
                        : 'bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400';
                    const statusText = isActive ? 'Ativo' : 'Inativo';
                    
                    return '<div class="client-card bg-white dark:bg-card-dark rounded-ios-xl p-4 shadow-sm border border-gray-100 dark:border-white/5 cursor-pointer active:scale-[0.98] transition-transform" data-cpf="' + client.cpf + '">' +
                        '<div class="flex items-center gap-3">' +
                            '<div class="size-12 rounded-full bg-primary/10 flex items-center justify-center text-primary">' +
                                '<span class="material-symbols-outlined">person</span>' +
                            '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<div class="flex items-center gap-2">' +
                                    '<p class="font-semibold text-[#000000] dark:text-white truncate">' + (client.name || 'Sem nome') + '</p>' +
                                    '<span class="' + statusClass + ' text-[10px] font-bold px-2 py-0.5 rounded-full uppercase shrink-0">' + statusText + '</span>' +
                                '</div>' +
                                '<p class="text-xs text-gray-500 dark:text-gray-400">' + cpfFormatado + '</p>' +
                                '<p class="text-xs text-gray-500 dark:text-gray-400 truncate">' + (client.city || '') + '</p>' +
                            '</div>' +
                            '<span class="material-symbols-outlined text-gray-400">chevron_right</span>' +
                        '</div>' +
                    '</div>';
                }).join('');
                
                // Adiciona eventos de clique
                container.querySelectorAll('.client-card').forEach(function(card) {
                    card.addEventListener('click', function() {
                        window.location.href = 'detalher.html?cpf=' + card.dataset.cpf;
                    });
                });
            } else {
                resultCount.textContent = '0 clientes encontrados';
                container.innerHTML = '<div class="text-center py-10">' +
                    '<span class="material-symbols-outlined text-4xl text-gray-300">search_off</span>' +
                    '<p class="text-gray-500 mt-4">Nenhum cliente encontrado</p>' +
                '</div>';
            }
        } catch (error) {
            console.error('Erro:', error);
            resultCount.textContent = 'Erro ao buscar';
            container.innerHTML = '<div class="text-center py-10">' +
                '<span class="material-symbols-outlined text-4xl text-red-300">error</span>' +
                '<p class="text-red-500 mt-4">Erro ao carregar clientes</p>' +
            '</div>';
        }
    }
});
</script>
</body></html>
