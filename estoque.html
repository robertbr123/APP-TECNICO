<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Gestão de Estoque - Ondeline</title>
<meta name="theme-color" content="#135bec"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Ondeline Tech"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" href="logo.png"/>
<link rel="apple-touch-icon" href="logo.png"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
        min-height: 100dvh;
    }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<!-- Header -->
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between border-b border-gray-100 dark:border-gray-800 sticky top-0 z-30">
<div class="flex items-center gap-3">
<div class="text-[#111318] dark:text-white flex items-center cursor-pointer" onclick="window.history.back()">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-[#111318] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">Estoque</h2>
</div>
<button id="btn-add" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-primary text-white font-medium">
<span class="material-symbols-outlined">add</span>
<span>Adicionar</span>
</button>
</div>

<!-- Tabs -->
<div class="bg-white dark:bg-background-dark px-4 py-3 border-b border-gray-100 dark:border-gray-800 overflow-x-auto">
<div class="flex gap-2 min-w-max">
<button class="tab-btn active px-4 py-2 rounded-lg text-sm font-medium bg-primary text-white" data-tab="list">Lista</button>
<button class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400" data-tab="stats">Estatísticas</button>
<button class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400" data-tab="movements">Movimentações</button>
<button class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400" data-tab="alerts">Alertas</button>
</div>
</div>

<!-- Conteúdo -->
<div class="p-4 pb-32">
<!-- Tab: Lista -->
<div id="tab-list" class="tab-content">
<!-- Filtros -->
<div class="bg-white dark:bg-background-dark rounded-xl border border-gray-100 dark:border-gray-800 p-4 mb-4">
<div class="grid grid-cols-2 gap-3 mb-3">
<select id="filter-type" class="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm">
<option value="">Todos os tipos</option>
<option value="router">Roteador</option>
<option value="modem">Modem</option>
<option value="onu">ONU</option>
<option value="cpe">CPE</option>
<option value="antenna">Antena</option>
<option value="other">Outro</option>
</select>
<select id="filter-status" class="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm">
<option value="">Todos os status</option>
<option value="available">Disponível</option>
<option value="in_use">Em uso</option>
<option value="maintenance">Manutenção</option>
<option value="defective">Defeituoso</option>
<option value="lost">Perdido</option>
</select>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
<input id="search-input" class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm" placeholder="Buscar por serial, modelo ou marca">
</div>
</div>

<!-- Lista de equipamentos -->
<div id="equipment-list" class="space-y-3">
<p class="text-gray-500 text-center py-8">Carregando equipamentos...</p>
</div>
</div>

<!-- Tab: Estatísticas -->
<div id="tab-stats" class="tab-content hidden">
<div class="bg-gradient-to-r from-primary to-blue-600 rounded-xl p-6 text-white mb-4">
<p class="text-sm opacity-80 mb-1">Valor Total do Estoque</p>
<p class="text-3xl font-bold" id="total-value">R$ 0,00</p>
</div>

<div class="grid grid-cols-2 gap-4 mb-4">
<div class="bg-green-50 dark:bg-green-500/10 rounded-xl p-4">
<p class="text-xs text-gray-500 dark:text-gray-400 mb-1">Disponíveis</p>
<p class="text-2xl font-bold text-green-600 dark:text-green-400" id="stat-available">0</p>
</div>
<div class="bg-blue-50 dark:bg-blue-500/10 rounded-xl p-4">
<p class="text-xs text-gray-500 dark:text-gray-400 mb-1">Em Uso</p>
<p class="text-2xl font-bold text-blue-600 dark:text-blue-400" id="stat-in-use">0</p>
</div>
</div>

<div id="stats-by-type" class="space-y-3">
<p class="text-gray-500 text-center py-4">Carregando estatísticas...</p>
</div>
</div>

<!-- Tab: Movimentações -->
<div id="tab-movements" class="tab-content hidden">
<div id="movements-list" class="space-y-3">
<p class="text-gray-500 text-center py-8">Carregando movimentações...</p>
</div>
</div>

<!-- Tab: Alertas -->
<div id="tab-alerts" class="tab-content hidden">
<div id="alerts-list" class="space-y-3">
<p class="text-gray-500 text-center py-8">Nenhum alerta encontrado</p>
</div>
</div>
</div>

<!-- Modal Adicionar Equipamento -->
<div id="modal-add" class="fixed inset-0 bg-black/50 flex items-end justify-center z-50 hidden">
<div class="bg-white dark:bg-background-dark w-full max-w-[600px] rounded-t-3xl p-6 max-h-[90vh] overflow-y-auto">
<div class="flex items-center justify-between mb-6">
<h3 class="text-xl font-bold text-[#111318] dark:text-white">Adicionar Equipamento</h3>
<button id="btn-close-modal" class="size-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center">
<span class="material-symbols-outlined text-gray-500">close</span>
</button>
</div>

<form id="form-add" class="space-y-4">
<div>
<label class="block text-sm font-semibold text-[#111318] dark:text-gray-300 mb-2">Número de Série *</label>
<input type="text" id="input-serial" class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800" placeholder="SN123456789" required uppercase>
</div>

<div>
<label class="block text-sm font-semibold text-[#111318] dark:text-gray-300 mb-2">Modelo *</label>
<input type="text" id="input-model" class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800" placeholder="Ex: Archer C6" required>
</div>

<div>
<label class="block text-sm font-semibold text-[#111318] dark:text-gray-300 mb-2">Marca</label>
<input type="text" id="input-brand" class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800" placeholder="Ex: TP-Link">
</div>

<div>
<label class="block text-sm font-semibold text-[#111318] dark:text-gray-300 mb-2">Tipo</label>
<select id="input-type" class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
<option value="router">Roteador</option>
<option value="modem">Modem</option>
<option value="onu">ONU</option>
<option value="cpe">CPE</option>
<option value="antenna">Antena</option>
<option value="other">Outro</option>
</select>
</div>

<div>
<label class="block text-sm font-semibold text-[#111318] dark:text-gray-300 mb-2">Localização</label>
<input type="text" id="input-location" class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800" placeholder="Ex: Estoque Principal">
</div>

<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-sm font-semibold text-[#111318] dark:text-gray-300 mb-2">Data de Compra</label>
<input type="date" id="input-purchase-date" class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
</div>
<div>
<label class="block text-sm font-semibold text-[#111318] dark:text-gray-300 mb-2">Preço (R$)</label>
<input type="number" id="input-price" class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800" placeholder="0.00" step="0.01">
</div>
</div>

<div>
<label class="block text-sm font-semibold text-[#111318] dark:text-gray-300 mb-2">Observações</label>
<textarea id="input-notes" class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 min-h-[100px]" placeholder="Observações sobre o equipamento"></textarea>
</div>

<button type="submit" class="w-full py-4 rounded-xl bg-primary hover:bg-primary/90 text-white font-bold flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add</span>
Adicionar Equipamento
</button>
</form>
</div>
</div>

<!-- Scripts -->
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/feedback.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
    // Tab navigation
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.dataset.tab;
            
            // Remove active from all
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active', 'bg-primary', 'text-white');
                b.classList.add('bg-gray-100', 'text-gray-600');
            });
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            
            // Add active to clicked
            btn.classList.add('active', 'bg-primary', 'text-white');
            btn.classList.remove('bg-gray-100', 'text-gray-600');
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            
            // Load content
            if (tab === 'stats') loadStatistics();
            if (tab === 'movements') loadMovements();
            if (tab === 'alerts') loadAlerts();
        });
    });

    // Modal
    document.getElementById('btn-add').addEventListener('click', () => {
        document.getElementById('modal-add').classList.remove('hidden');
    });
    
    document.getElementById('btn-close-modal').addEventListener('click', () => {
        document.getElementById('modal-add').classList.add('hidden');
    });

    // Form
    document.getElementById('form-add').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const data = {
            action: 'add',
            serial_number: document.getElementById('input-serial').value,
            model: document.getElementById('input-model').value,
            brand: document.getElementById('input-brand').value,
            type: document.getElementById('input-type').value,
            location: document.getElementById('input-location').value,
            purchase_date: document.getElementById('input-purchase-date').value,
            purchase_price: document.getElementById('input-price').value,
            notes: document.getElementById('input-notes').value
        };

        this.querySelector('button[type="submit"]').disabled = true;
        this.querySelector('button[type="submit"]').innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Adicionando...';

        try {
            const response = await API.inventory(data);
            if (response.success) {
                showSuccess('Equipamento adicionado com sucesso!');
                document.getElementById('modal-add').classList.add('hidden');
                document.getElementById('form-add').reset();
                loadEquipmentList();
            } else {
                showError('Erro: ' + response.message);
            }
        } catch (error) {
            showError('Erro ao adicionar: ' + error.message);
        } finally {
            this.querySelector('button[type="submit"]').disabled = false;
            this.querySelector('button[type="submit"]').innerHTML = '<span class="material-symbols-outlined">add</span> Adicionar Equipamento';
        }
    });

    // Filters
    const filterType = document.getElementById('filter-type');
    const filterStatus = document.getElementById('filter-status');
    const searchInput = document.getElementById('search-input');

    const debouncedLoad = Utils.debounce(loadEquipmentList, 500);
    filterType.addEventListener('change', debouncedLoad);
    filterStatus.addEventListener('change', debouncedLoad);
    searchInput.addEventListener('input', debouncedLoad);

    // Load initial data
    loadEquipmentList();
});

async function loadEquipmentList() {
    const container = document.getElementById('equipment-list');
    const type = document.getElementById('filter-type').value;
    const status = document.getElementById('filter-status').value;
    const search = document.getElementById('search-input').value;

    container.innerHTML = '<p class="text-gray-500 text-center py-8"><span class="material-symbols-outlined animate-spin">sync</span> Carregando...</p>';

    try {
        const response = await fetch(`/api/inventory.php?action=list&status=${status}&type=${type}&search=${search}`, {
            headers: {
                'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
            }
        });
        const result = await response.json();

        if (result.success && result.data.length > 0) {
            container.innerHTML = result.data.map(equip => {
                const statusColors = {
                    available: 'bg-green-100 text-green-600',
                    in_use: 'bg-blue-100 text-blue-600',
                    maintenance: 'bg-yellow-100 text-yellow-600',
                    defective: 'bg-red-100 text-red-600',
                    lost: 'bg-gray-100 text-gray-600'
                };
                const statusLabels = {
                    available: 'Disponível',
                    in_use: 'Em uso',
                    maintenance: 'Manutenção',
                    defective: 'Defeituoso',
                    lost: 'Perdido'
                };
                const statusClass = statusColors[equip.status] || 'bg-gray-100 text-gray-600';
                const statusLabel = statusLabels[equip.status] || equip.status;

                return `
                    <div class="bg-white dark:bg-background-dark rounded-xl border border-gray-100 dark:border-gray-800 p-4">
                        <div class="flex items-start justify-between mb-2">
                            <div>
                                <h4 class="font-bold text-[#111318] dark:text-white">${equip.serial_number}</h4>
                                <p class="text-sm text-gray-500">${equip.brand} ${equip.model}</p>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-medium ${statusClass}">${statusLabel}</span>
                        </div>
                        <div class="text-xs text-gray-500 space-y-1">
                            <p><span class="material-symbols-outlined text-sm align-middle">category</span> ${equip.type}</p>
                            <p><span class="material-symbols-outlined text-sm align-middle">location_on</span> ${equip.location}</p>
                            ${equip.client_name ? `<p><span class="material-symbols-outlined text-sm align-middle">person</span> ${equip.client_name}</p>` : ''}
                        </div>
                        <div class="flex gap-2 mt-3">
                            ${equip.status === 'available' ? `
                                <button onclick="checkoutEquipment(${equip.id}, '${equip.serial_number}')" class="flex-1 py-2 rounded-lg bg-green-500 text-white text-sm font-medium">
                                    <span class="material-symbols-outlined">output</span>
                                    Entregar
                                </button>
                            ` : ''}
                            ${equip.status === 'in_use' ? `
                                <button onclick="returnEquipment(${equip.id}, '${equip.serial_number}')" class="flex-1 py-2 rounded-lg bg-blue-500 text-white text-sm font-medium">
                                    <span class="material-symbols-outlined">input</span>
                                    Retornar
                                </button>
                            ` : ''}
                            <button onclick="editEquipment(${equip.id})" class="flex-1 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 text-sm font-medium">
                                <span class="material-symbols-outlined">edit</span>
                                Editar
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        } else {
            container.innerHTML = '<p class="text-gray-500 text-center py-8">Nenhum equipamento encontrado</p>';
        }
    } catch (error) {
        container.innerHTML = '<p class="text-red-500 text-center py-8">Erro ao carregar: ' + error.message + '</p>';
    }
}

async function loadStatistics() {
    try {
        const response = await fetch('/api/inventory.php?action=statistics', {
            headers: {
                'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
            }
        });
        const result = await response.json();

        if (result.success) {
            document.getElementById('total-value').textContent = Utils.formatCurrency(result.data.summary.total_value);
            document.getElementById('stat-available').textContent = result.data.summary.total_available;
            document.getElementById('stat-in-use').textContent = result.data.summary.total_in_use;

            const container = document.getElementById('stats-by-type');
            container.innerHTML = result.data.by_status_type.map(stat => `
                <div class="bg-white dark:bg-background-dark rounded-xl border border-gray-100 dark:border-gray-800 p-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-medium text-[#111318] dark:text-white capitalize">${stat.type}</p>
                            <p class="text-sm text-gray-500">${stat.status}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-bold text-primary">${stat.count}</p>
                            <p class="text-sm text-gray-500">${Utils.formatCurrency(stat.total_value)}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    } catch (error) {
        console.error('Erro ao carregar estatísticas:', error);
    }
}

async function loadMovements() {
    const container = document.getElementById('movements-list');
    container.innerHTML = '<p class="text-gray-500 text-center py-8"><span class="material-symbols-outlined animate-spin">sync</span> Carregando...</p>';

    try {
        const response = await fetch('/api/inventory.php?action=movements&limit=20', {
            headers: {
                'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
            }
        });
        const result = await response.json();

        if (result.success && result.data.length > 0) {
            container.innerHTML = result.data.map(mov => {
                const typeLabels = {
                    in: 'Entrada',
                    out: 'Saída',
                    transfer: 'Transferência',
                    maintenance: 'Manutenção',
                    defective: 'Defeito',
                    lost: 'Perdido'
                };
                const typeColors = {
                    in: 'text-green-600',
                    out: 'text-blue-600',
                    transfer: 'text-purple-600',
                    maintenance: 'text-yellow-600',
                    defective: 'text-red-600',
                    lost: 'text-gray-600'
                };

                return `
                    <div class="bg-white dark:bg-background-dark rounded-xl border border-gray-100 dark:border-gray-800 p-4">
                        <div class="flex items-start justify-between">
                            <div class="flex-1">
                                <p class="font-semibold text-[#111318] dark:text-white">${mov.serial_number}</p>
                                <p class="text-sm text-gray-500">${mov.brand} ${mov.model}</p>
                                <div class="text-xs text-gray-500 mt-2">
                                    <p><span class="material-symbols-outlined text-sm align-middle">person</span> ${mov.username}</p>
                                    <p><span class="material-symbols-outlined text-sm align-middle">schedule</span> ${new Date(mov.created_at).toLocaleString('pt-BR')}</p>
                                </div>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-medium ${typeColors[mov.movement_type]}">${typeLabels[mov.movement_type]}</span>
                        </div>
                    </div>
                `;
            }).join('');
        } else {
            container.innerHTML = '<p class="text-gray-500 text-center py-8">Nenhuma movimentação encontrada</p>';
        }
    } catch (error) {
        console.error('Erro ao carregar movimentações:', error);
    }
}

async function loadAlerts() {
    const container = document.getElementById('alerts-list');
    container.innerHTML = '<p class="text-gray-500 text-center py-8"><span class="material-symbols-outlined animate-spin">sync</span> Carregando...</p>';

    try {
        const response = await fetch('/api/inventory.php?action=alerts', {
            headers: {
                'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
            }
        });
        const result = await response.json();

        if (result.success && result.data.length > 0) {
            container.innerHTML = result.data.map(alert => {
                const severityColors = {
                    info: 'bg-blue-100 text-blue-600',
                    warning: 'bg-yellow-100 text-yellow-600',
                    critical: 'bg-red-100 text-red-600'
                };
                const severityLabels = {
                    info: 'Informação',
                    warning: 'Atenção',
                    critical: 'Crítico'
                };
                const severityClass = severityColors[alert.severity] || 'bg-gray-100 text-gray-600';
                const severityLabel = severityLabels[alert.severity] || alert.severity;

                return `
                    <div class="bg-white dark:bg-background-dark rounded-xl border border-gray-100 dark:border-gray-800 p-4">
                        <div class="flex items-start gap-3">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="px-3 py-1 rounded-full text-xs font-medium ${severityClass}">${severityLabel}</span>
                                    <span class="text-xs text-gray-500">${new Date(alert.created_at).toLocaleString('pt-BR')}</span>
                                </div>
                                <p class="text-sm text-[#111318] dark:text-white">${alert.message}</p>
                            </div>
                            <button onclick="resolveAlert(${alert.id})" class="px-3 py-1 rounded-lg bg-green-500 text-white text-sm font-medium">
                                Resolver
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        } else {
            container.innerHTML = '<p class="text-gray-500 text-center py-8">Nenhum alerta encontrado</p>';
        }
    } catch (error) {
        console.error('Erro ao carregar alertas:', error);
    }
}

async function checkoutEquipment(id, serial) {
    const cpf = prompt(`Informe o CPF do cliente para entregar o equipamento ${serial}:`);
    if (!cpf) return;

    const notes = prompt('Observações (opcional):', '');

    try {
        showLoading(true);
        const response = await fetch('/api/inventory.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
            },
            body: JSON.stringify({
                action: 'checkout',
                equipment_id: id,
                client_cpf: cpf,
                notes: notes
            })
        });

        const result = await response.json();
        if (result.success) {
            showSuccess('Equipamento entregue ao cliente!');
            loadEquipmentList();
        } else {
            showError('Erro: ' + result.message);
        }
    } catch (error) {
        showError('Erro ao entregar: ' + error.message);
    } finally {
        showLoading(false);
    }
}

async function returnEquipment(id, serial) {
    const confirmReturn = confirm(`Deseja retornar o equipamento ${serial} ao estoque?`);
    if (!confirmReturn) return;

    const status = prompt('Status do equipamento:\n1. available (Disponível)\n2. defective (Defeituoso)\n\nDigite 1 ou 2:', '1');
    if (!status) return;

    const statusMap = { '1': 'available', '2': 'defective' };
    const finalStatus = statusMap[status] || 'available';
    const location = prompt('Localização:', 'Estoque Principal');
    const notes = prompt('Observações (opcional):', '');

    try {
        showLoading(true);
        const response = await fetch('/api/inventory.php', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
            },
            body: JSON.stringify({
                action: 'return',
                id: id,
                status: finalStatus,
                location: location,
                notes: notes
            })
        });

        const result = await response.json();
        if (result.success) {
            showSuccess('Equipamento retornado ao estoque!');
            loadEquipmentList();
        } else {
            showError('Erro: ' + result.message);
        }
    } catch (error) {
        showError('Erro ao retornar: ' + error.message);
    } finally {
        showLoading(false);
    }
}

async function resolveAlert(alertId) {
    try {
        const response = await fetch('/api/inventory.php', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
            },
            body: JSON.stringify({
                action: 'resolve_alert',
                alert_id: alertId
            })
        });

        const result = await response.json();
        if (result.success) {
            showSuccess('Alerta resolvido!');
            loadAlerts();
        } else {
            showError('Erro: ' + result.message);
        }
    } catch (error) {
        showError('Erro ao resolver: ' + error.message);
    }
}
